name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Lifecycle scripts stay off (pnpm-workspace.yaml allowBuilds, and --ignore-scripts).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # The golden vectors must still be what the spec produces (independent implementation, no SDK code).
      - run: pnpm vectors:check

      # The built package works: CLI entry point and the offline example.
      - run: node packages/verify/dist/cli.js --help
      - run: pnpm examples

  # The npm tarball works for a user: packed exactly as `npm publish` would pack it, installed into an empty project,
  # then the bin and the offline example run against it. Packed on the repository's Node; run on the minimum Node in
  # packages/verify engines and on 24. (The test suite itself needs Node 22.12+ for vitest, so it runs in `check`.)
  package:
    name: package (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # prepack builds dist/ and copies LICENSE and NOTICE in.
      - name: npm pack
        working-directory: packages/verify
        run: mkdir -p "$RUNNER_TEMP/pack" && npm pack --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: install the tarball and run the bin and an example
        run: node scripts/pack-smoke.mjs "$RUNNER_TEMP"/pack/chartrunner-verify-*.tgz
